name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release
      id-token: write # npm provenance (links package to exact git commit)

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view smart-ai-router@${PKG_VERSION} version 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ]; then
            echo "Publishing smart-ai-router@${PKG_VERSION}..."
            npm publish --access public --provenance
          else
            echo "smart-ai-router@${PKG_VERSION} already published — skipping publish, creating GitHub Release only."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
