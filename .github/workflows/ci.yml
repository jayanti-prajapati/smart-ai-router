name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # - name: Test
      #   run: npm test
      #   env:
      #     OPENAI_API_KEY: test

      - name: Build
        run: npm run build

      - name: Verify dist exists
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts missing" && exit 1)

  # ── Auto-release ────────────────────────────────────────────────────────────
  # Runs only on pushes to main (not on PRs) after all build matrix jobs pass.
  # Bumps the patch version, commits, tags, and pushes — which in turn
  # triggers release.yml to publish to npm and create a GitHub Release.
  release:
    name: Auto patch release
    needs: build
    runs-on: ubuntu-latest
    # Only run on direct pushes to main, not on PR merge previews or tag pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write # push version-bump commit + tag

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token that can push back to main (PAT or GITHUB_TOKEN with write)
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version, commit & tag
        run: |
          # npm version patch: updates package.json, commits, and creates a local tag
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: release v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"

      - name: Push commit and tag
        run: git push origin main --follow-tags
